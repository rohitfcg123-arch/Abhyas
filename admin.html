<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b2a63"><title>Abhyas Admin — Question Bank</title>
<link rel="stylesheet" href="admin.css?v=20261007-02">
</head>
<body>
<div class="login" id="loginView">
  <div class="login-card"><div class="logo">A</div><h1>Abhyas Admin</h1><p>Question Bank Management</p>
    <form id="loginForm"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button class="primary">Login</button><div class="or-divider"><span>OR</span></div><button type="button" id="googleLoginBtn" class="google-btn"><span class="google-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M21.35 12.23c0-.79-.07-1.55-.22-2.27H12v4.3h5.22a4.46 4.46 0 0 1-1.94 2.93v2.42h3.14c1.84-1.69 2.93-4.18 2.93-7.38z"/><path fill="#34A853" d="M12 21.85c2.63 0 4.84-.87 6.45-2.36l-3.14-2.42c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.5A9.74 9.74 0 0 0 12 21.85z"/><path fill="#FBBC05" d="M6.54 13.96A5.86 5.86 0 0 1 6.23 12c0-.68.12-1.34.31-1.96v-2.5H3.3A9.82 9.82 0 0 0 2.15 12c0 1.58.38 3.08 1.15 4.46l3.24-2.5z"/><path fill="#EA4335" d="M12 6.01c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.83 3.02 14.63 2.15 12 2.15a9.74 9.74 0 0 0-8.7 5.39l3.24 2.5C7.31 7.73 9.46 6.01 12 6.01z"/></svg></span><span>Continue with Google</span></button><div id="loginMsg"></div></form>
  </div>
</div>
<div class="app" id="appView" hidden>
<header><div><strong>Abhyas Admin</strong><span>Question Bank</span></div><button id="logoutBtn" class="secondary">Logout</button></header>
<main>
<section class="toolbar"><div><h1>Questions</h1><p id="summary">Select an exam to manage its questions.</p></div><div class="actions"><button id="downloadTemplate" class="secondary">JSON Template</button><label class="primary file-btn">Upload JSON<input id="jsonFile" type="file" accept=".json,application/json" hidden></label></div></section>
<div id="message" class="message" hidden></div>
<div class="layout">
<aside class="panel"><h2>Exams</h2><div id="examList" class="exam-list"></div></aside>
<section class="panel questions-panel"><div class="question-head"><h2 id="selectedExam">Select an exam</h2><input id="questionSearch" placeholder="Search questions..."></div><div id="questionList" class="question-list"><div class="empty">Choose an exam.</div></div></section>
</div>
</main>
</div>
<script type="module" src="admin.js?v=20261007-03"></script>
</body></html>
